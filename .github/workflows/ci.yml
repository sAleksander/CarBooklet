name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run lint:colors
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Supabase CLI is a devDependency pinned by package-lock, so `npx`
      # resolves it straight after `npm ci` — no setup-cli action needed.
      #
      # Containers this suite never touches are excluded to cut start-up time.
      # `config.toml` is deliberately left alone so local dev keeps Studio and
      # the rest. `kong` is NOT excluded: it is the :54321 gateway the tests
      # actually talk to. Migrations apply automatically on start.
      - name: Start local Supabase
        run: |
          # `supabase start` ends by printing a status table that contains the
          # stack's freshly-generated service-role secret. The key is ephemeral
          # and the stack only ever listens on 127.0.0.1 inside this runner, so
          # it is worthless to anyone who reads it -- but this log is public and
          # printing a credential is not a habit worth keeping. Output is held
          # back unless the start actually fails, where diagnostics matter more
          # than tidiness, and redacted even then.
          npx supabase start -x realtime,storage-api,imgproxy,mailpit,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/start.log" 2>&1 \
            || { sed -E 's/(sb_secret_|sb_publishable_)[A-Za-z0-9_-]+/\1<redacted>/g' "$RUNNER_TEMP/start.log"; exit 1; }
          echo "local stack up"
      # Deliberately NOT `secrets.SUPABASE_URL` — that one points at the cloud
      # project, and `integration/globalSetup.ts` hard-refuses any non-local
      # host. These tests create and delete real users, so that guard is the
      # whole reason reusing the app's own variable names is safe here.
      #
      # The key names are printed (never the values) so a CLI rename surfaces
      # as a readable log line rather than an empty variable three steps later.
      - name: Export local stack credentials
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/stack.env"
          echo "keys available: $(cut -d= -f1 "$RUNNER_TEMP/stack.env" | tr '\n' ' ')"
          set -a; . "$RUNNER_TEMP/stack.env"; set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "resolved SUPABASE_URL=$API_URL"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: |
          # `supabase start` ends by printing a status table that contains the
          # stack's freshly-generated service-role secret. The key is ephemeral
          # and the stack only ever listens on 127.0.0.1 inside this runner, so
          # it is worthless to anyone who reads it -- but this log is public and
          # printing a credential is not a habit worth keeping. Output is held
          # back unless the start actually fails, where diagnostics matter more
          # than tidiness, and redacted even then.
          npx supabase start -x realtime,storage-api,imgproxy,mailpit,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/start.log" 2>&1 \
            || { sed -E 's/(sb_secret_|sb_publishable_)[A-Za-z0-9_-]+/\1<redacted>/g' "$RUNNER_TEMP/start.log"; exit 1; }
          echo "local stack up"
      # Deliberately NOT `secrets.SUPABASE_URL` — that one points at the cloud
      # project, and `integration/globalSetup.ts` hard-refuses any non-local
      # host. These tests create and delete real users, so that guard is the
      # whole reason reusing the app's own variable names is safe here.
      #
      # The key names are printed (never the values) so a CLI rename surfaces
      # as a readable log line rather than an empty variable three steps later.
      - name: Export local stack credentials
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/stack.env"
          echo "keys available: $(cut -d= -f1 "$RUNNER_TEMP/stack.env" | tr '\n' ' ')"
          set -a; . "$RUNNER_TEMP/stack.env"; set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "resolved SUPABASE_URL=$API_URL"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # The preview server is wrangler-backed, so the built Worker reads its
      # runtime config from `dist/server/.dev.vars` -- which `astro build` copies
      # from `.dev.vars` at the repo root. Without this file the app builds fine
      # and then serves a missing-config banner, and every spec dies at sign-in.
      # `.dev.vars` is gitignored, so it never exists on a fresh runner.
      #
      # No OPENROUTER_API_KEY: no spec touches OpenRouter, and the change brief
      # rules out putting that secret in CI at all.
      - name: Write .dev.vars for the preview server
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
          } > .dev.vars
      - run: npx playwright install --with-deps chromium
      # `npm run test:e2e` builds and starts the preview server itself, via
      # playwright.config.ts's webServer.
      - run: npm run test:e2e
      # Without this a red e2e job leaves only reporter lines: the runner is
      # destroyed with the traces and screenshots still on it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [ci, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Upload the Worker's *runtime* env. The build-time env above only
          # affects `astro build`; without this the deployed Worker has no
          # Supabase config and every auth call fails at fetch time.
          secrets: |
            SUPABASE_URL
            SUPABASE_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
